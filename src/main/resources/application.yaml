server:
  port: 8081

app:
  name: "To-Do List API"
  version: 2.0.0

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  flyway:
    enabled: true
  jpa:
    open-in-view: false